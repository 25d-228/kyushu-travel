name: Build unified travel website
on:
  push:
    branches: [feature/unified-travel]
    paths:
      - '.build/**'
      - '.github/workflows/prepare-unified.yml'
      - 'scripts/refine_unified.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prepare-unified-travel
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-travel
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: 25d-228/kyushu-cycle-guide
          ref: eb6c04987062e68af31a23b6b2e6a7b597eb721a
          path: _source
          persist-credentials: false
      - name: Expand the checksum-verified authored source
        run: |
          node <<'JS'
          const fs=require('fs'),path=require('path'),zlib=require('zlib'),crypto=require('crypto');
          if(!fs.existsSync('.build/applied')){
            const encoded=fs.readdirSync('.build').filter(n=>/^part\d+\.b64$/.test(n)).sort().map(n=>fs.readFileSync('.build/'+n,'utf8')).join('');
            const data=zlib.brotliDecompressSync(Buffer.from(encoded,'base64'));
            const expected='0dd316d3b5017c0bd557e2096d0873d57c2e622c35cf86cbd89856bba492dadc';
            if(crypto.createHash('sha256').update(data).digest('hex')!==expected)throw Error('Source checksum mismatch');
            const files=JSON.parse(data);
            for(const [name,content] of Object.entries(files)){
              if(path.isAbsolute(name)||name.split('/').includes('..')||typeof content!=='string')throw Error('Invalid source path');
              fs.mkdirSync(path.dirname(name),{recursive:true});fs.writeFileSync(name,content);
            }
            fs.writeFileSync('.build/applied',expected+'\n');
            console.log('Verified and expanded',Object.keys(files).length,'authored source files');
          }
          JS
      - name: Apply reviewed refinements
        run: |
          if [ -f scripts/refine_unified.py ]; then python scripts/refine_unified.py; fi
          node --check assets/app.js
      - name: Migrate all six plans and retain photographic credits
        run: python -u scripts/build.py _source
      - name: Install browser validation tools
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
      - name: Test shared navigation, rest days, settings, dates, photos and mobile screens
        run: python -u scripts/test_unified.py
      - name: Commit the validated website
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .build/applied index.html cycling.html rail.html assets scripts README.md .nojekyll PHOTO-CREDITS.md RAIL-PHOTO-CREDITS.md MAP-LICENSES.txt migration-report.json unified-test-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Build validated unified travel planner with six preserved itineraries'
            git push origin HEAD:feature/unified-travel
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-reviewed-site
          path: |
            index.html
            cycling.html
            rail.html
            assets
            scripts
            README.md
            PHOTO-CREDITS.md
            RAIL-PHOTO-CREDITS.md
            MAP-LICENSES.txt
            migration-report.json
            unified-test-report.json
            home.png
            detail-*.png
          retention-days: 7
