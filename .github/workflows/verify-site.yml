name: Verify unified travel website
on:
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-unified-travel
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install browser validation tools
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
      - name: Confirm published files match the repository
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request, hashlib, json, time
          base='https://25d-228.github.io/kyushu-travel/'
          report={}
          for name in ['index.html','assets/app.js','assets/app.css','assets/data.js','assets/photos/data.js','cycling.html','rail.html']:
            expected=Path(name).read_bytes()
            for attempt in range(12):
              try:
                request=urllib.request.Request(base+name+'?verify='+hashlib.sha256(expected).hexdigest()[:12],headers={'User-Agent':'KyushuTravelVerification/1.0','Cache-Control':'no-cache'})
                with urllib.request.urlopen(request,timeout=30) as response:
                  actual=response.read()
                  assert response.status==200
                assert actual==expected, 'Published file differs from repository: '+name
                report[name]={'bytes':len(actual),'sha256':hashlib.sha256(actual).hexdigest(),'matched':True}
                break
              except Exception:
                if attempt==11: raise
                time.sleep(10)
          Path('live-verification.json').write_text(json.dumps({'url':base,'status':'passed','files':report},indent=2))
          print(json.dumps(report))
          PY
      - name: Test all six plans on the live site
        env:
          SITE_URL: https://25d-228.github.io/kyushu-travel/
        run: python -u scripts/test_unified.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-live-verification
          path: |
            unified-test-report.json
            live-verification.json
            migration-report.json
            home.png
            detail-*.png
          retention-days: 7
